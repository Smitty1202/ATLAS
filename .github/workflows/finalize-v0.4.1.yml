name: Finalize v0.4.1 updater release

on:
  push:
    branches:
      - feature/self-updater
    paths:
      - .github/workflows/finalize-v0.4.1.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/self-updater

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Finalize v0.4.1 metadata
        shell: pwsh
        run: ./scripts/finalize-v041.ps1

      - name: Install frontend dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Compile Tauri backend and tests
        run: cargo test --no-run --locked --manifest-path app/src-tauri/Cargo.toml

      - name: Build frontend
        working-directory: app
        run: bun run build

      - name: Commit finalized v0.4.1 metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git add app/package.json app/src-tauri/tauri.conf.json app/src-tauri/Cargo.toml app/src-tauri/Cargo.lock CHANGELOG.md docs/UPDATER.md
          git rm scripts/finalize-v041.ps1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize v0.4.1 signed updater"
          git push origin HEAD:feature/self-updater
