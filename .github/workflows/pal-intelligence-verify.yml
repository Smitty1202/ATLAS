name: Pal Intelligence verification

on:
  push:
    branches:
      - feature/pal-intelligence-inventory
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/pal-intelligence-inventory

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Normalize changelog line endings
        shell: pwsh
        run: |
          $text = Get-Content CHANGELOG.md -Raw
          $text = $text.Replace("`r`n", "`n")
          Set-Content CHANGELOG.md -Value $text -NoNewline -Encoding utf8

      - name: Generate Pal Intelligence slice
        shell: pwsh
        run: ./scripts/build-pal-intelligence-slice1.ps1

      - name: Install frontend dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Run Pal Intelligence selector tests
        working-directory: app
        run: bun test src/views/pal-intelligence/selectors.test.ts

      - name: Build frontend
        working-directory: app
        run: bun run build

      - name: Commit verified slice
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git add app/src/App.tsx app/src/state.tsx app/src/views/PalIntelligence.tsx app/src/views/pal-intelligence/selectors.ts app/src/views/pal-intelligence/selectors.test.ts CHANGELOG.md
          git rm scripts/build-pal-intelligence-slice1.ps1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add Pal Intelligence inventory explorer"
          git push origin HEAD:feature/pal-intelligence-inventory
