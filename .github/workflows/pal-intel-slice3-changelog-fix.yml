name: Pal Intelligence Slice 3 changelog cleanup

on:
  push:
    branches:
      - feature/pal-intelligence-species-roles
    paths:
      - .github/workflows/pal-intel-slice3-changelog-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/pal-intelligence-species-roles

      - name: Fix changelog
        shell: pwsh
        run: ./scripts/fix-slice3-changelog.ps1

      - name: Commit cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git add CHANGELOG.md
          git rm scripts/fix-slice3-changelog.ps1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix Slice 3 changelog placement"
          git push origin HEAD:feature/pal-intelligence-species-roles
