name: Pal Intelligence species roles verification

on:
  push:
    branches:
      - feature/pal-intelligence-species-roles
    paths:
      - .github/workflows/pal-intel-species-roles-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/pal-intelligence-species-roles

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Apply Slice 3 integration
        shell: pwsh
        run: ./scripts/apply-pal-intel-species-roles.ps1

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Run Pal Intelligence tests
        working-directory: app
        run: bun test src/views/pal-intelligence/selectors.test.ts src/views/pal-intelligence/recommendations.test.ts src/views/pal-intelligence/species-roles.test.ts

      - name: Build frontend
        working-directory: app
        run: bun run build

      - name: Commit verified Slice 3 integration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git add app/src/views/PalIntelligence.tsx CHANGELOG.md
          git rm scripts/apply-pal-intel-species-roles.ps1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Integrate species-level Pal Intelligence roles"
          git push origin HEAD:feature/pal-intelligence-species-roles
