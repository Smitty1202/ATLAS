name: Pal Intelligence polish verification

on:
  push:
    branches:
      - feature/pal-intelligence-inventory
    paths:
      - app/src/views/PalIntelligence.tsx
      - app/src/views/pal-intelligence/**
      - .github/workflows/pal-intelligence-polish-verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/pal-intelligence-inventory
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Run Pal Intelligence tests
        working-directory: app
        run: bun test src/views/pal-intelligence/selectors.test.ts
      - name: Build frontend
        working-directory: app
        run: bun run build
