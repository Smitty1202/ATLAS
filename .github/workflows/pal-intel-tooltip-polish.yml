name: Pal Intelligence tooltip polish verification

on:
  push:
    branches:
      - feature/pal-intelligence-recommendations
    paths:
      - .github/workflows/pal-intel-tooltip-polish.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/pal-intelligence-recommendations

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Apply tooltip polish
        shell: pwsh
        run: ./scripts/apply-pal-intel-tooltip-polish.ps1

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Run Pal Intelligence tests
        working-directory: app
        run: bun test src/views/pal-intelligence/selectors.test.ts src/views/pal-intelligence/recommendations.test.ts

      - name: Build frontend
        working-directory: app
        run: bun run build

      - name: Commit verified tooltip polish
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git add app/src/views/pal-intelligence/instance-intel.tsx app/src/lib/ui.ts CHANGELOG.md
          git rm scripts/apply-pal-intel-tooltip-polish.ps1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Polish Pal Intelligence passive hover cards"
          git push origin HEAD:feature/pal-intelligence-recommendations
