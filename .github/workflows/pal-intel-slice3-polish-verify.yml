name: Pal Intelligence Slice 3 polish verification

on:
  push:
    branches:
      - feature/pal-intelligence-species-roles
    paths:
      - .github/workflows/pal-intel-slice3-polish-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/pal-intelligence-species-roles

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Run Pal Intelligence tests
        working-directory: app
        run: bun test src/views/pal-intelligence/selectors.test.ts src/views/pal-intelligence/recommendations.test.ts src/views/pal-intelligence/species-roles.test.ts

      - name: Build frontend
        working-directory: app
        run: bun run build
