name: v0.6 Roster Intelligence refinement verification

on:
  push:
    branches:
      - feature/roster-intelligence
    paths:
      - '.github/scripts/refine-roster-intelligence.py'
      - '.github/workflows/v06-roster-intelligence-refine-verify.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/roster-intelligence
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply refinements
        shell: pwsh
        run: python .github/scripts/refine-roster-intelligence.py

      - name: Install frontend dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Focused Pal Intelligence tests
        working-directory: app
        run: bun test src/views/pal-intelligence/roster-intelligence.test.ts src/views/pal-intelligence/species-roles.test.ts src/views/pal-intelligence/recommendations.test.ts src/views/pal-intelligence/condensation.test.ts

      - name: Frontend production build
        working-directory: app
        run: bun run build

      - name: Commit verified refinements
        shell: pwsh
        run: |
          git diff --check
          git rm .github/workflows/v06-roster-intelligence-refine-verify.yml .github/scripts/refine-roster-intelligence.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md app/src/views/PalIntelligence.tsx app/src/views/pal-intelligence/roster-intelligence.ts app/src/views/pal-intelligence/roster-intelligence-panel.tsx app/src/views/pal-intelligence/roster-intelligence.test.ts
          git commit -m "Refine cross-species Roster Intelligence"
          git push origin HEAD:feature/roster-intelligence
