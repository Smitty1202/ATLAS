name: Guild marker verification

on:
  push:
    branches:
      - fix/sftp-local-map-data

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/sftp-local-map-data
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Palworld 1.0 guild marker decoding
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          # ----- characters.rs: retain current guild ownership parsing and decode
          # the marker block introduced/current in Palworld 1.0 guild raw data.
          p = Path("crates/pal-save/src/characters.rs")
          s = p.read_text(encoding="utf-8")

          old = '''/// A guild (`EPalGroupType::Guild`/`IndependentGuild`) parsed from
          /// `GroupSaveDataMap`. `member_candidates` are the distinct non-zero guids
          /// found in the player-list region of the raw record; the caller intersects
          /// them with the known player uids to get true members.
          #[derive(Debug, Clone, Default)]
          pub struct GuildRaw {
              pub guild_id: Guid,
              pub guild_name: String,
              pub base_ids: Vec<Guid>,
              pub member_candidates: Vec<Guid>,
          }
          '''
          new = '''/// One shared guild marker persisted in Palworld 1.0 `GroupSaveDataMap`.
          #[derive(Debug, Clone, PartialEq)]
          pub struct GuildMarkerRaw {
              pub marker_id: Guid,
              pub x: f64,
              pub y: f64,
              pub z: f64,
              pub icon_type: i32,
              pub owner_player_uid: Guid,
          }

          /// A guild (`EPalGroupType::Guild`/`IndependentGuild`) parsed from
          /// `GroupSaveDataMap`. `member_candidates` are the distinct non-zero guids
          /// found in the player-list region of the raw record; the caller intersects
          /// them with the known player uids to get true members. `markers` contains
          /// the current 1.0 shared-guild map markers when that section is present.
          #[derive(Debug, Clone, Default)]
          pub struct GuildRaw {
              pub guild_id: Guid,
              pub guild_name: String,
              pub base_ids: Vec<Guid>,
              pub member_candidates: Vec<Guid>,
              pub markers: Vec<GuildMarkerRaw>,
          }
          '''
          if old not in s:
              raise SystemExit("GuildRaw anchor not found")
          s = s.replace(old, new, 1)

          start = s.index("fn decode_guild(bytes: &[u8]) -> Option<GuildRaw> {")
          end = s.index("\nfn talent(", start)
          replacement = r'''fn decode_guild(bytes: &[u8]) -> Option<GuildRaw> {
              let mut br = Reader::new(bytes);
              let guild_id = br.guid().ok()?;
              let _group_name = br.fstring().ok()?;
              let handle_count = br.u32().ok()?;
              br.skip(handle_count as usize * 32).ok()?;

              // Palworld 1.0 guild section: org_type byte + four leading bytes.
              // Older ATLAS code consumed the same five bytes as u32+u8, so base
              // parsing stayed aligned; spell the current layout correctly now.
              let _org_type = br.u8().ok()?;
              br.skip(4).ok()?;

              let base_count = br.u32().ok()?;
              let mut base_ids = Vec::with_capacity(base_count as usize);
              for _ in 0..base_count {
                  base_ids.push(br.guid().ok()?);
              }
              let _unknown1 = br.i32().ok()?;
              let _base_camp_level = br.i32().ok()?;
              let point_count = br.u32().ok()?;
              br.skip(point_count as usize * 16).ok()?;
              let guild_name = br.fstring().ok().unwrap_or_default();

              // Current 1.0 layout immediately follows the guild name with the
              // last-name-modifier player UID, then a marker count and fixed-size
              // guild-marker records. Pre-1.0 records do not have this shape; the
              // helper deliberately fails soft and returns no markers for them.
              let rest = &bytes[br.pos().min(bytes.len())..];
              let markers = decode_guild_markers(rest).unwrap_or_default();

              // Preserve the existing membership recovery behavior: scan the full
              // trailing region and let the caller intersect candidates with known
              // player UIDs. Marker IDs/coordinates cannot become members; owner
              // UIDs may appear here but are legitimate guild members anyway.
              let mut member_candidates = Vec::new();
              let mut i = 0;
              while i + 16 <= rest.len() {
                  let w: Guid = rest[i..i + 16].try_into().ok()?;
                  if w != Guid::default() && !member_candidates.contains(&w) {
                      member_candidates.push(w);
                  }
                  i += 1;
              }

              Some(GuildRaw {
                  guild_id,
                  guild_name,
                  base_ids,
                  member_candidates,
                  markers,
              })
          }

          /// Decode the Palworld 1.0 shared-guild marker section at the start of
          /// the post-name guild tail. Each record is:
          /// marker_id Guid, location Vector (3xf64), icon_type i32, owner Guid.
          fn decode_guild_markers(rest: &[u8]) -> Option<Vec<GuildMarkerRaw>> {
              const MARKER_BYTES: usize = 16 + 24 + 4 + 16;
              const MAX_MARKERS: usize = 1024;
              const WORLD_LIMIT: f64 = 2_000_000.0;

              let mut r = Reader::new(rest);
              let _last_guild_name_modifier_player_uid = r.guid().ok()?;
              let count = r.u32().ok()? as usize;
              if count > MAX_MARKERS || count.checked_mul(MARKER_BYTES)? > r.remaining() {
                  return None;
              }

              let mut markers = Vec::with_capacity(count);
              for _ in 0..count {
                  let marker_id = r.guid().ok()?;
                  let x = r.f64().ok()?;
                  let y = r.f64().ok()?;
                  let z = r.f64().ok()?;
                  let icon_type = r.i32().ok()?;
                  let owner_player_uid = r.guid().ok()?;
                  if !x.is_finite()
                      || !y.is_finite()
                      || !z.is_finite()
                      || x.abs() >= WORLD_LIMIT
                      || y.abs() >= WORLD_LIMIT
                  {
                      return None;
                  }
                  markers.push(GuildMarkerRaw {
                      marker_id,
                      x,
                      y,
                      z,
                      icon_type,
                      owner_player_uid,
                  });
              }
              Some(markers)
          }
          '''
          s = s[:start] + replacement + s[end:]

          test = r'''

              #[test]
              fn palworld_1_0_guild_markers_decode_from_group_tail() {
                  fn fstring(out: &mut Vec<u8>, value: &str) {
                      out.extend_from_slice(&((value.len() + 1) as i32).to_le_bytes());
                      out.extend_from_slice(value.as_bytes());
                      out.push(0);
                  }

                  let guild_id: Guid = [1; 16];
                  let owner_a: Guid = [7; 16];
                  let owner_b: Guid = [8; 16];
                  let marker_a: Guid = [3; 16];
                  let marker_b: Guid = [4; 16];
                  let modifier: Guid = [5; 16];

                  let mut raw = Vec::new();
                  raw.extend_from_slice(&guild_id);
                  fstring(&mut raw, "group");
                  raw.extend_from_slice(&0u32.to_le_bytes()); // character handles
                  raw.push(0); // org type
                  raw.extend_from_slice(&[0; 4]); // current leading bytes
                  raw.extend_from_slice(&0u32.to_le_bytes()); // base ids
                  raw.extend_from_slice(&0i32.to_le_bytes()); // unknown_1
                  raw.extend_from_slice(&20i32.to_le_bytes()); // base camp level
                  raw.extend_from_slice(&0u32.to_le_bytes()); // base-camp points
                  fstring(&mut raw, "Smitty Guild");
                  raw.extend_from_slice(&modifier);
                  raw.extend_from_slice(&2u32.to_le_bytes());

                  raw.extend_from_slice(&marker_a);
                  raw.extend_from_slice(&1234.5f64.to_le_bytes());
                  raw.extend_from_slice(&(-6789.25f64).to_le_bytes());
                  raw.extend_from_slice(&42.0f64.to_le_bytes());
                  raw.extend_from_slice(&3i32.to_le_bytes());
                  raw.extend_from_slice(&owner_a);

                  raw.extend_from_slice(&marker_b);
                  raw.extend_from_slice(&(-111.0f64).to_le_bytes());
                  raw.extend_from_slice(&222.0f64.to_le_bytes());
                  raw.extend_from_slice(&0.0f64.to_le_bytes());
                  raw.extend_from_slice(&9i32.to_le_bytes());
                  raw.extend_from_slice(&owner_b);

                  let guild = decode_guild(&raw).expect("guild");
                  assert_eq!(guild.guild_id, guild_id);
                  assert_eq!(guild.guild_name, "Smitty Guild");
                  assert_eq!(guild.markers.len(), 2);
                  assert_eq!(guild.markers[0].marker_id, marker_a);
                  assert_eq!(guild.markers[0].x, 1234.5);
                  assert_eq!(guild.markers[0].y, -6789.25);
                  assert_eq!(guild.markers[0].icon_type, 3);
                  assert_eq!(guild.markers[0].owner_player_uid, owner_a);
                  assert_eq!(guild.markers[1].marker_id, marker_b);
                  assert_eq!(guild.markers[1].icon_type, 9);
                  assert_eq!(guild.markers[1].owner_player_uid, owner_b);
              }
          '''
          close = s.rfind("\n}")
          if close < 0:
              raise SystemExit("characters test module close not found")
          s = s[:close] + test + s[close:]
          p.write_text(s, encoding="utf-8")

          # ----- mapstate.rs: combine legacy LocalData markers with server-side
          # Palworld 1.0 guild markers from the same Level.sav already loaded.
          p = Path("app/src-tauri/src/mapstate.rs")
          s = p.read_text(encoding="utf-8")

          old = '''    let level_blob = decompress(&dir.join("Level.sav")).ok();
              let nicknames = nicknames_from_level(level_blob.as_deref());
              let players = read_players(dir, &nicknames);
              let bases = bases_from_level(level_blob.as_deref());

              let (local, local_source) = discover_local_data(save_source, local_data_path);
              Ok(assemble(local, local_source, players, bases))
          '''
          new = '''    let level_blob = decompress(&dir.join("Level.sav")).ok();
              let (nicknames, guild_markers) = level_context(level_blob.as_deref());
              let players = read_players(dir, &nicknames);
              let bases = bases_from_level(level_blob.as_deref());

              let (local, local_source) = discover_local_data(save_source, local_data_path);
              Ok(assemble(
                  local,
                  local_source,
                  guild_markers,
                  players,
                  bases,
              ))
          '''
          if old not in s:
              raise SystemExit("folder map-state anchor not found")
          s = s.replace(old, new, 1)

          old = '''    let level_blob = decompress_bytes(&bundle.level).ok();
              let nicknames = nicknames_from_level(level_blob.as_deref());
              let players = read_players_from_parts(&bundle.players, &nicknames);
              let bases = bases_from_level(level_blob.as_deref());

              // Dedicated servers normally do NOT own the player's LocalData.sav. Resolve
              // it on the ATLAS machine using the remote world's folder id, with the
              // explicit per-save override taking precedence.
              let (local, local_source) = discover_local_data(save_source, local_data_path);
              Ok(assemble(local, local_source, players, bases))
          '''
          new = '''    let level_blob = decompress_bytes(&bundle.level).ok();
              let (nicknames, guild_markers) = level_context(level_blob.as_deref());
              let players = read_players_from_parts(&bundle.players, &nicknames);
              let bases = bases_from_level(level_blob.as_deref());

              // Dedicated servers normally do NOT own the player's LocalData.sav. Resolve
              // it on the ATLAS machine using the remote world's folder id, with the
              // explicit per-save override taking precedence. Shared 1.0 guild markers
              // come from the remote Level.sav and are merged in `assemble`.
              let (local, local_source) = discover_local_data(save_source, local_data_path);
              Ok(assemble(
                  local,
                  local_source,
                  guild_markers,
                  players,
                  bases,
              ))
          '''
          if old not in s:
              raise SystemExit("sftp map-state anchor not found")
          s = s.replace(old, new, 1)

          start = s.index("fn assemble(")
          end = s.index("\nfn bases_from_level", start)
          replacement = r'''fn assemble(
              local: Option<LocalData>,
              local_source: Option<String>,
              guild_markers: Vec<CustomMarker>,
              players: Vec<MapPlayerState>,
              bases: Option<Vec<BaseDto>>,
          ) -> MapState {
              let (fog, mut markers) = match local {
                  Some(ld) => (Some(build_fog(ld.layers)), ld.markers),
                  None => (None, Vec::new()),
              };

              // Keep legacy/private LocalData pins when a save still carries them,
              // and add the shared guild markers persisted in current Level.sav.
              // Exact-coordinate dedupe prevents a transitional save from drawing
              // the same pin twice if the game happens to persist it in both places.
              for marker in guild_markers {
                  if !markers.iter().any(|m| {
                      m.x == marker.x && m.y == marker.y && m.icon_type == marker.icon_type
                  }) {
                      markers.push(marker);
                  }
              }

              MapState {
                  fog,
                  local_source,
                  markers: build_markers(markers),
                  players,
                  bases,
              }
          }

          fn level_context(
              level_blob: Option<&[u8]>,
          ) -> (HashMap<String, String>, Vec<CustomMarker>) {
              let Some(blob) = level_blob else {
                  return (HashMap::new(), Vec::new());
              };
              let mut warnings = Vec::new();
              let Ok(parsed) = pal_save::characters::parse_level(blob, &mut warnings) else {
                  return (HashMap::new(), Vec::new());
              };

              let nicknames = parsed
                  .players
                  .iter()
                  .map(|p| (guid_str(&p.uid), p.name.clone()))
                  .collect();
              let markers = parsed
                  .guilds
                  .into_iter()
                  .flat_map(|g| g.markers)
                  .map(|m| CustomMarker {
                      x: m.x,
                      y: m.y,
                      icon_type: m.icon_type,
                  })
                  .collect();
              (nicknames, markers)
          }
          '''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding="utf-8")

          # ----- localdata.rs: keep legacy reader, remove constants made obsolete
          # by the helper split so the branch stays warning-free.
          p = Path("crates/pal-save/src/localdata.rs")
          s = p.read_text(encoding="utf-8")
          s = s.replace('    const ICON_TYPE_NAME: &[u8] = b"IconType";\n    const INT_PROPERTY: &[u8] = b"IntProperty";\n', '', 1)
          p.write_text(s, encoding="utf-8")

          # ----- changelog: describe the actual current 1.0 source accurately.
          p = Path("CHANGELOG.md")
          s = p.read_text(encoding="utf-8")
          old = '- World Map now combines SFTP dedicated-server Level/Players data with the matching local client `LocalData.sav`, restoring player positions, bases, fog of war, and player-placed custom markers for remote worlds.\n'
          new = '- World Map now combines SFTP dedicated-server Level/Players data with the matching local client `LocalData.sav`, restoring player positions, bases, and fog of war for remote worlds.\n- Added Palworld 1.0 guild-marker decoding from `Level.sav` `GroupSaveDataMap`, so shared guild markers render for local and dedicated-server worlds while legacy LocalData pins remain supported.\n'
          if old not in s:
              raise SystemExit("changelog anchor not found")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          '@ | python -

      - name: Format changed Rust files
        shell: pwsh
        run: rustfmt --edition 2021 crates/pal-save/src/characters.rs crates/pal-save/src/localdata.rs app/src-tauri/src/mapstate.rs

      - name: Verify focused guild marker regression
        shell: pwsh
        run: cargo test --manifest-path crates/pal-save/Cargo.toml palworld_1_0_guild_markers_decode_from_group_tail -- --nocapture

      - name: Verify legacy LocalData marker fixture
        shell: pwsh
        run: cargo test --manifest-path crates/pal-save/Cargo.toml dedicated_client_localdata_reveal -- --nocapture

      - name: Check desktop code
        shell: pwsh
        run: cargo check --manifest-path app/src-tauri/Cargo.toml

      - name: Compile desktop tests
        shell: pwsh
        run: cargo test --no-run --manifest-path app/src-tauri/Cargo.toml

      - name: Install frontend dependencies
        working-directory: app
        shell: pwsh
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: app
        shell: pwsh
        run: bun run build

      - name: Commit verified guild marker fix and remove diagnostics
        shell: pwsh
        run: |
          git rm .github/workflows/guild-marker-verify.yml
          if (Test-Path crates/pal-save/src/bin/inspect-localdata.rs) {
            git rm crates/pal-save/src/bin/inspect-localdata.rs
          }
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md app/src-tauri/src/mapstate.rs crates/pal-save/src/characters.rs crates/pal-save/src/localdata.rs
          git commit -m "Read Palworld 1.0 guild markers from Level.sav"
          git push origin HEAD:fix/sftp-local-map-data
