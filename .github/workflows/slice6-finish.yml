name: Temporary Slice 6 Finisher

on:
  push:
    branches:
      - wip/slice6

permissions:
  contents: write

jobs:
  finish-slice6:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/slice6
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Finish Slice 6 edits
        shell: pwsh
        run: |
          $script = Join-Path $env:RUNNER_TEMP 'finish-slice6.py'
          @'
          from pathlib import Path

          def read(path: str) -> str:
              with open(path, 'r', encoding='utf-8', newline=None) as f:
                  return f.read()

          def write(path: str, text: str) -> None:
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              with open(p, 'w', encoding='utf-8', newline='\n') as f:
                  f.write(text)

          # Finish the interrupted MapView focus handoff.
          map_path = 'app/src/views/map/MapView.tsx'
          text = read(map_path)
          apply_start = text.index('const applyMapFocus')
          set_filters = text.index('setFilters((f) => ({', apply_start)
          line_start = text.rfind('\n', 0, set_filters) + 1
          commit_gesture = text.index('commitGesture();', set_filters)
          commit_line_start = text.rfind('\n', 0, commit_gesture) + 1
          text = text[:line_start] + text[commit_line_start:]

          cleanup_old = '      clearTimeout(settleTimer.current);\n      dragAbort.current?.abort();'
          if cleanup_old not in text:
              raise RuntimeError('unmount cleanup anchor not found')
          text = text.replace(
              cleanup_old,
              '      clearTimeout(settleTimer.current);\n      clearTimeout(focusTimer.current);\n      dragAbort.current?.abort();',
              1,
          )

          effect_start = text.index('  useEffect(() => {\n    if (!mapFocusTarget)', apply_start)
          effect_end = text.index('\n\n  // Stable callback', effect_start)
          effect = '''  useEffect(() => {
            if (!mapFocusTarget) return;
            if (!isLayerKey(mapFocusTarget.layer)) {
              clearLocalFocus();
              clearMapFocusTarget();
              return;
            }
            if (mapFocusTarget.layer !== layer) {
              selectLayer(mapFocusTarget.layer);
              return;
            }
            if (applyMapFocus(mapFocusTarget)) {
              armLocalFocus(mapFocusTarget.id);
              clearMapFocusTarget();
            }
          }, [
            mapFocusTarget,
            layer,
            selectLayer,
            applyMapFocus,
            clearMapFocusTarget,
            clearLocalFocus,
            armLocalFocus,
            viewport.w,
            viewport.h,
          ]);'''
          effect = '\n'.join(line[10:] if line.startswith('          ') else line for line in effect.splitlines())
          text = text[:effect_start] + effect + text[effect_end:]

          prop_anchor = '            containerRef={pinContainerRef}\n'
          if prop_anchor not in text:
              raise RuntimeError('PinLayer containerRef anchor not found')
          text = text.replace(
              prop_anchor,
              prop_anchor + '            focusedPoiId={focusedPoiId}\n',
              1,
          )
          write(map_path, text)

          # Move the pure visibility selector out of PinLayer so Bun tests do not
          # pull in the UI/Tauri module graph.
          pin_path = 'app/src/views/map/PinLayer.tsx'
          pin = read(pin_path)
          pin = pin.replace(
              'import { isRevealed, type FogMask } from "./fog";',
              'import type { FogMask } from "./fog";',
              1,
          )
          pin = pin.replace(
              'import type { PoiPin } from "./pins";',
              'import type { PoiPin } from "./pins";\nimport { resolveVisiblePois } from "./pin-visibility";',
              1,
          )
          pin = pin.replace('  effigyTypeIsVisible,\n', '', 1)
          pin = pin.replace('const CULL_MARGIN = 200;\n', '', 1)
          selector_start = pin.index('export interface VisiblePoi')
          selector_end = pin.index('const DIM_STYLE: CSSProperties', selector_start)
          pin = pin[:selector_start] + pin[selector_end:]
          write(pin_path, pin)

          visibility_path = 'app/src/views/map/pin-visibility.ts'
          write(visibility_path, '''import { worldToPx, type MapEntry } from "../../lib/map-coords";
          import { effigyTypeIsVisible, type EffigyTypeSelection } from "./effigy-filter";
          import { isRevealed, type FogMask } from "./fog";
          import type { PoiPin } from "./pins";

          const CULL_MARGIN = 200;

          export interface PoiVisibilityFilters {
            fastTravel: boolean;
            alpha: boolean;
            effigies: boolean;
            bounties: boolean;
            towers: boolean;
            hideUnfoundEffigies: boolean;
            hideFoundEffigies?: boolean;
          }

          export interface VisiblePoi {
            pin: PoiPin;
            left: number;
            top: number;
            focused: boolean;
          }

          export interface ResolveVisiblePoisOptions {
            entry: MapEntry;
            layer: string;
            k: number;
            tx: number;
            ty: number;
            vw: number;
            vh: number;
            pois: PoiPin[];
            filters: PoiVisibilityFilters;
            effigySelection: EffigyTypeSelection;
            fog: FogMask | null;
            fogOn: boolean;
            showHidden: boolean;
            focusedPoiId?: string | null;
          }

          export function poiFocusId(pin: PoiPin): string {
            return `${pin.kind}:${pin.key}`;
          }

          function pinHiddenByFilters(
            pin: PoiPin,
            filters: PoiVisibilityFilters,
            effigySelection: EffigyTypeSelection,
          ): boolean {
            if (pin.kind === "fast_travel" && !filters.fastTravel) return true;
            if (pin.kind === "alpha" && !filters.alpha) return true;
            if (pin.kind === "effigy" && !filters.effigies) return true;
            if (
              pin.kind === "effigy" &&
              !effigyTypeIsVisible(effigySelection, pin.effigyType)
            )
              return true;
            if (pin.kind === "effigy" && filters.hideUnfoundEffigies && !pin.found)
              return true;
            if (pin.kind === "effigy" && filters.hideFoundEffigies && pin.found)
              return true;
            if (pin.kind === "bounty" && !filters.bounties) return true;
            return pin.kind === "tower" && !filters.towers;
          }

          function pinHiddenByFog({
            entry,
            pin,
            fog,
            fogOn,
            showHidden,
          }: {
            entry: MapEntry;
            pin: PoiPin;
            fog: FogMask | null;
            fogOn: boolean;
            showHidden: boolean;
          }): boolean {
            if (!fogOn || !fog || pin.known || showHidden) return false;
            const [W, H] = entry.px;
            const [u, v] = worldToPx(entry, pin.x, pin.y);
            return !isRevealed(fog, u / W, v / H);
          }

          export function resolveVisiblePois({
            entry,
            layer,
            k,
            tx,
            ty,
            vw,
            vh,
            pois,
            filters,
            effigySelection,
            fog,
            fogOn,
            showHidden,
            focusedPoiId = null,
          }: ResolveVisiblePoisOptions): VisiblePoi[] {
            if (k <= 0) return [];
            const minU = (-tx - CULL_MARGIN) / k;
            const minV = (-ty - CULL_MARGIN) / k;
            const maxU = (vw - tx + CULL_MARGIN) / k;
            const maxV = (vh - ty + CULL_MARGIN) / k;
            const out: VisiblePoi[] = [];
            const focusedOut: VisiblePoi[] = [];

            for (const pin of pois) {
              if (pin.map !== layer) continue;
              const focused = focusedPoiId === poiFocusId(pin);
              if (!focused && pinHiddenByFilters(pin, filters, effigySelection)) continue;

              const [u, v] = worldToPx(entry, pin.x, pin.y);
              if (u < minU || u > maxU || v < minV || v > maxV) continue;
              if (!focused && pinHiddenByFog({ entry, pin, fog, fogOn, showHidden }))
                continue;

              const visible = { pin, left: u * k, top: v * k, focused };
              if (focused) focusedOut.push(visible);
              else out.push(visible);
            }

            return [...out, ...focusedOut];
          }
          '''.replace('          ', ''))

          test_path = 'app/src/views/map/pin-visibility.test.ts'
          write(test_path, '''import { expect, test } from "bun:test";
          import type { MapEntry } from "../../lib/map-coords";
          import type { FogMask } from "./fog";
          import type { PoiPin } from "./pins";
          import {
            poiFocusId,
            resolveVisiblePois,
            type PoiVisibilityFilters,
          } from "./pin-visibility";

          const entry: MapEntry = {
            image: "",
            px: [100, 100],
            world_min: [0, 0],
            world_max: [100, 100],
            mask_px: [2, 2],
            world_to_px: "test",
          };

          const baseFilters: PoiVisibilityFilters = {
            fastTravel: true,
            alpha: true,
            effigies: true,
            bounties: true,
            towers: true,
            hideUnfoundEffigies: false,
            hideFoundEffigies: false,
          };

          const fogged: FogMask = {
            layer: "MainMap",
            blurred: null as unknown as HTMLCanvasElement,
            maskW: 2,
            maskH: 2,
            revealed: new Uint8Array(4),
          };

          function pin(
            key: string,
            kind: PoiPin["kind"] = "fast_travel",
            extra: Partial<PoiPin> = {},
          ): PoiPin {
            return {
              key,
              kind,
              map: "MainMap",
              x: 50,
              y: 50,
              found: false,
              known: false,
              ...extra,
            };
          }

          function visible(
            pois: PoiPin[],
            focusedPoiId: string | null,
            filters: PoiVisibilityFilters = baseFilters,
            effigySelection: string[] | null = null,
          ) {
            return resolveVisiblePois({
              entry,
              layer: "MainMap",
              k: 1,
              tx: 0,
              ty: 0,
              vw: 100,
              vh: 100,
              pois,
              filters,
              effigySelection,
              fog: fogged,
              fogOn: true,
              showHidden: false,
              focusedPoiId,
            });
          }

          test("focused POI alone bypasses a disabled category filter and fog", () => {
            const target = pin("target");
            const neighbor = pin("neighbor", "fast_travel", { x: 52, y: 52 });
            const filters = { ...baseFilters, fastTravel: false };
            const result = visible([target, neighbor], poiFocusId(target), filters);
            expect(result).toHaveLength(1);
            expect(result[0]?.pin.key).toBe("target");
            expect(result[0]?.focused).toBe(true);
          });

          test("focused POI bypasses fog without revealing a neighboring POI", () => {
            const target = pin("target");
            const neighbor = pin("neighbor", "fast_travel", { x: 52, y: 52 });
            const result = visible([target, neighbor], poiFocusId(target));
            expect(result.map((row) => row.pin.key)).toEqual(["target"]);
            expect(result[0]?.focused).toBe(true);
          });

          test("focused effigy bypasses type and hide-unfound filters only for itself", () => {
            const target = pin("target", "effigy", { effigyType: "CapturePower" });
            const sibling = pin("sibling", "effigy", {
              x: 52,
              y: 52,
              effigyType: "CapturePower",
            });
            const filters = { ...baseFilters, hideUnfoundEffigies: true };
            const result = visible([target, sibling], poiFocusId(target), filters, []);
            expect(result.map((row) => row.pin.key)).toEqual(["target"]);
            expect(result[0]?.focused).toBe(true);
          });

          test("no focus preserves normal spoiler visibility", () => {
            const target = pin("target");
            expect(visible([target], null)).toEqual([]);
          });
          '''.replace('          ', ''))

          ignore_path = '.gitignore'
          ignore = read(ignore_path)
          if 'tools/pal-boss-keys/obj/' not in ignore:
              ignore = ignore.rstrip() + '\n\n# pal-boss-keys dev tool build output\ntools/pal-boss-keys/bin/\ntools/pal-boss-keys/obj/\n'
              write(ignore_path, ignore)

          changelog_path = 'CHANGELOG.md'
          changelog = read(changelog_path)
          marker = '- Added Missing World Objectives to Progress with searchable unresolved map\n  objectives and one-click focus on the matching World Map POI.\n'
          if marker not in changelog:
              raise RuntimeError('changelog anchor not found')
          addition = marker + '\n### Changed\n- Objective map focus now reveals only the selected POI temporarily, without changing\n  global map filters or spoiler visibility for neighboring pins.\n'
          changelog = changelog.replace(marker, addition, 1)
          write(changelog_path, changelog)
          '@ | Set-Content -Path $script -Encoding UTF8
          python $script

      - name: Install frontend dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Test frontend
        working-directory: app
        run: bun test

      - name: Build frontend
        working-directory: app
        run: bun run build

      - name: Commit finished Slice 6 to WIP branch
        shell: pwsh
        run: |
          Remove-Item .github/workflows/slice6-finish.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Finish objective map focus"
          git push origin HEAD:wip/slice6
