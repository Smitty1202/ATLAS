name: ATLAS v0.5.0 release verification

on:
  push:
    branches:
      - release/v0.5.0
    paths:
      - .github/workflows/release-v050-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/v0.5.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"

      - name: Validate release versions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expected = "0.5.0"
          $package = (Get-Content "app/package.json" -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content "app/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $cargoLine = Select-String -Path "app/src-tauri/Cargo.toml" -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          if (-not $cargoLine) { throw "Could not read Cargo.toml package version." }
          $cargo = $cargoLine.Matches[0].Groups[1].Value
          if ($package -ne $expected -or $tauri -ne $expected -or $cargo -ne $expected) {
            throw "Version mismatch: package=$package tauri=$tauri cargo=$cargo expected=$expected"
          }
          Write-Host "Version manifests agree on $expected."

      - name: Finalize changelog date
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = "CHANGELOG.md"
          $text = Get-Content $path -Raw
          $old = "## [0.5.0] - Unreleased"
          $new = "## [0.5.0] - 2026-09-11"
          if (-not $text.Contains($old)) { throw "Expected 0.5.0 Unreleased heading not found." }
          $text = $text.Replace($old, $new)
          Set-Content $path $text -Encoding utf8

      - name: Install JS dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Refresh desktop lockfile
        run: cargo check --manifest-path app/src-tauri/Cargo.toml

      - name: Compile desktop tests without executing runner-sensitive binary
        run: cargo test --no-run --manifest-path app/src-tauri/Cargo.toml

      - name: Run Pal Intelligence tests
        working-directory: app
        run: bun test src/views/pal-intelligence/selectors.test.ts src/views/pal-intelligence/recommendations.test.ts src/views/pal-intelligence/species-roles.test.ts

      - name: Build frontend
        working-directory: app
        run: bun run build

      - name: Commit verified release prep
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git add CHANGELOG.md app/src-tauri/Cargo.lock
          git rm .github/workflows/release-v050-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize ATLAS v0.5.0 release prep"
          git push origin HEAD:release/v0.5.0
