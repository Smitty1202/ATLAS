name: Pal Intelligence tooltip verification

on:
  push:
    branches:
      - feature/pal-intelligence-recommendations
    paths:
      - app/src/views/pal-intelligence/instance-intel.tsx
      - .github/workflows/pal-intel-tooltip-verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/pal-intelligence-recommendations

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Run Pal Intelligence tests
        working-directory: app
        run: bun test src/views/pal-intelligence/selectors.test.ts src/views/pal-intelligence/recommendations.test.ts

      - name: Build frontend
        working-directory: app
        run: bun run build
