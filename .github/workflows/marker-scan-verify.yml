name: Marker scan verification

on:
  push:
    branches:
      - fix/sftp-local-map-data

permissions:
  contents: write

jobs:
  verify:
    if: github.event.head_commit.message == 'Add temporary marker scan verification workflow'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply targeted marker fix
        run: python .github/scripts/apply-marker-scan-fix.py

      - name: Format marker parser only
        run: rustfmt crates/pal-save/src/localdata.rs

      - name: Run focused pal-save marker regression
        run: cargo test -p pal-save targeted_custom_marker_scan_recovers_vector_and_icon_type -- --nocapture

      - name: Check desktop code
        run: cargo check --manifest-path app/src-tauri/Cargo.toml

      - name: Compile desktop tests
        run: cargo test --manifest-path app/src-tauri/Cargo.toml --no-run

      - name: Install frontend dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: app
        run: bun run build

      - name: Commit verified marker fix and remove temporary automation
        shell: pwsh
        run: |
          Remove-Item .github/scripts/apply-marker-scan-fix.py -Force
          Remove-Item .github/workflows/marker-scan-verify.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden LocalData custom marker decoding"
          git push origin HEAD:fix/sftp-local-map-data
