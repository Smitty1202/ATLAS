name: Map SFTP LocalData fix verification

on:
  push:
    branches:
      - fix/sftp-local-map-data

permissions:
  contents: write

jobs:
  verify:
    if: github.event.head_commit.message == 'Retry map SFTP verification without executing runner test binary'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply focused map fix
        run: python .github/scripts/apply-map-sftp-localdata-fix.py

      - name: Format Rust
        run: cargo fmt --manifest-path app/src-tauri/Cargo.toml

      - name: Install frontend dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Check desktop code
        run: cargo check --manifest-path app/src-tauri/Cargo.toml

      - name: Compile desktop tests without executing runner-sensitive binary
        run: cargo test --manifest-path app/src-tauri/Cargo.toml --no-run

      - name: Build frontend
        working-directory: app
        run: bun run build

      - name: Commit verified fix and remove temporary automation
        shell: pwsh
        run: |
          Remove-Item .github/scripts/apply-map-sftp-localdata-fix.py -Force
          Remove-Item .github/workflows/map-sftp-localdata-verify.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix SFTP local map data integration"
          git push origin HEAD:fix/sftp-local-map-data
