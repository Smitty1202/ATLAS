name: v0.6 Condensation Intelligence verification

on:
  push:
    branches:
      - feature/condensation-intelligence

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/condensation-intelligence
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Implement Condensation Intelligence
        run: python .github/scripts/implement-condensation.py

      - name: Install frontend dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Focused condensation tests
        working-directory: app
        run: bun test src/views/pal-intelligence/condensation.test.ts src/views/pal-intelligence/recommendations.test.ts src/views/pal-intelligence/species-roles.test.ts

      - name: Frontend production build
        working-directory: app
        run: bun run build

      - name: Commit verified slice
        shell: pwsh
        run: |
          git diff --check
          git rm .github/workflows/v06-condensation-verify.yml .github/scripts/implement-condensation.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md app/src/views/PalIntelligence.tsx app/src/views/pal-intelligence/condensation.ts app/src/views/pal-intelligence/condensation-summary.tsx app/src/views/pal-intelligence/condensation.test.ts
          git commit -m "Add Condensation Intelligence recommendations"
          git push origin HEAD:feature/condensation-intelligence
