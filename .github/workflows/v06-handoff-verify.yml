name: v0.6 Pal Intelligence handoff verification

on:
  push:
    branches:
      - feature/pal-intelligence-handoffs

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pal-intelligence-handoffs
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Implement typed handoffs
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"anchor missing: {label}")
              return text.replace(old, new, 1)

          # Small typed cross-tool handoff contract + pure builders.
          write("app/src/lib/tool-handoff.ts", r'''export interface HandoffSubject {
            speciesId: string;
            speciesName: string;
            instanceId?: string;
            instanceLabel?: string;
          }

          export interface IvTargets {
            hp: number;
            attack: number;
            defense: number;
          }

          export interface SolverHandoff {
            destination: "solver";
            source: "pal-intelligence";
            subject: HandoffSubject;
            requiredPassives: string[];
            reason: string;
          }

          export interface IvLabHandoff {
            destination: "ivlab";
            source: "pal-intelligence";
            subject: HandoffSubject;
            suggestedIvs?: IvTargets;
            reason: string;
          }

          export type ToolHandoff = SolverHandoff | IvLabHandoff;

          function cleanSubject(subject: HandoffSubject | null): HandoffSubject | null {
            if (!subject) return null;
            const speciesId = subject.speciesId.trim();
            const speciesName = subject.speciesName.trim();
            if (!speciesId || !speciesName) return null;
            const instanceId = subject.instanceId?.trim();
            const instanceLabel = subject.instanceLabel?.trim();
            return {
              speciesId,
              speciesName,
              ...(instanceId ? { instanceId } : {}),
              ...(instanceLabel ? { instanceLabel } : {}),
            };
          }

          function cleanReason(reason: string | undefined, fallback: string): string {
            const value = reason?.trim();
            return value || fallback;
          }

          export function buildSolverHandoff(
            subject: HandoffSubject | null,
            options: { requiredPassives?: string[]; reason?: string } = {},
          ): SolverHandoff | null {
            const clean = cleanSubject(subject);
            if (!clean) return null;
            const requiredPassives = [
              ...new Set(
                (options.requiredPassives ?? [])
                  .map((value) => value.trim())
                  .filter(Boolean),
              ),
            ];
            return {
              destination: "solver",
              source: "pal-intelligence",
              subject: clean,
              requiredPassives,
              reason: cleanReason(
                options.reason,
                "Selected species from Pal Intelligence.",
              ),
            };
          }

          function cleanIv(value: number): number {
            if (!Number.isFinite(value)) return 0;
            return Math.max(0, Math.min(100, Math.round(value)));
          }

          export function buildIvLabHandoff(
            subject: HandoffSubject | null,
            options: { suggestedIvs?: IvTargets; reason?: string } = {},
          ): IvLabHandoff | null {
            const clean = cleanSubject(subject);
            if (!clean) return null;
            const suggested = options.suggestedIvs
              ? {
                  hp: cleanIv(options.suggestedIvs.hp),
                  attack: cleanIv(options.suggestedIvs.attack),
                  defense: cleanIv(options.suggestedIvs.defense),
                }
              : null;
            return {
              destination: "ivlab",
              source: "pal-intelligence",
              subject: clean,
              ...(suggested && (suggested.hp > 0 || suggested.attack > 0 || suggested.defense > 0)
                ? { suggestedIvs: suggested }
                : {}),
              reason: cleanReason(
                options.reason,
                "Selected species from Pal Intelligence.",
              ),
            };
          }

          export function handoffView(handoff: ToolHandoff): "solver" | "ivlab" {
            return handoff.destination;
          }
          ''')

          write("app/src/lib/tool-handoff.test.ts", r'''import { describe, expect, test } from "bun:test";
          import {
            buildIvLabHandoff,
            buildSolverHandoff,
            handoffView,
          } from "./tool-handoff";

          const subject = {
            speciesId: "Anubis",
            speciesName: "Anubis",
            instanceId: "abc123",
            instanceLabel: "Atlas",
          };

          describe("Pal Intelligence tool handoffs", () => {
            test("solver payload normalizes visible target passives and routes to Solver", () => {
              const handoff = buildSolverHandoff(subject, {
                requiredPassives: ["Musclehead", " Serenity ", "Musclehead", ""],
                reason: "Best combat copy",
              });
              expect(handoff).not.toBeNull();
              expect(handoff?.requiredPassives).toEqual(["Musclehead", "Serenity"]);
              expect(handoff?.subject.instanceId).toBe("abc123");
              expect(handoff && handoffView(handoff)).toBe("solver");
            });

            test("IV Lab carries suggested floors without making them mandatory", () => {
              const handoff = buildIvLabHandoff(subject, {
                suggestedIvs: { hp: 110, attack: 82.4, defense: -5 },
                reason: "Species-best owned IVs",
              });
              expect(handoff?.suggestedIvs).toEqual({ hp: 100, attack: 82, defense: 0 });
              expect(handoff && handoffView(handoff)).toBe("ivlab");
            });

            test("no-data subjects fail soft and zero IV suggestions are omitted", () => {
              expect(buildSolverHandoff(null)).toBeNull();
              expect(buildIvLabHandoff({ speciesId: "", speciesName: "Anubis" })).toBeNull();
              expect(
                buildIvLabHandoff(subject, {
                  suggestedIvs: { hp: 0, attack: 0, defense: 0 },
                })?.suggestedIvs,
              ).toBeUndefined();
            });
          });
          ''')

          # App state owns exactly one pending typed handoff and routes by destination.
          p = Path("app/src/state.tsx")
          s = read(p)
          s = replace_once(
              s,
              'import type { SolveSpec } from "./lib/use-solve";\n',
              'import type { SolveSpec } from "./lib/use-solve";\nimport { handoffView, type ToolHandoff } from "./lib/tool-handoff";\n',
              "state import",
          )
          s = replace_once(
              s,
              '  /** Species name the Solver should pre-fill on its next render, or null. */\n',
              '  /** One-shot typed cross-tool handoff, consumed by Solver or IV Lab. */\n  toolHandoff: ToolHandoff | null;\n  /** Route to the handoff destination while preserving its visible context. */\n  requestToolHandoff: (handoff: ToolHandoff) => void;\n  /** Destination clears the pending payload after consuming it. */\n  clearToolHandoff: () => void;\n  /** Species name the Solver should pre-fill on its next render, or null. */\n',
              "state interface handoff",
          )
          s = replace_once(
              s,
              '  const [view, setView] = useState<View>("save");\n  const [solveTarget, setSolveTarget] = useState<string | null>(null);\n',
              '  const [view, setView] = useState<View>("save");\n  const [toolHandoff, setToolHandoff] = useState<ToolHandoff | null>(null);\n  const [solveTarget, setSolveTarget] = useState<string | null>(null);\n',
              "state hook handoff",
          )
          s = replace_once(
              s,
              '  const requestSolve = useCallback((speciesName: string) => {\n',
              '  const requestToolHandoff = useCallback((handoff: ToolHandoff) => {\n    setToolHandoff(handoff);\n    setView(handoffView(handoff));\n  }, []);\n  const clearToolHandoff = useCallback(() => setToolHandoff(null), []);\n\n  const requestSolve = useCallback((speciesName: string) => {\n',
              "state callbacks",
          )
          s = replace_once(
              s,
              '      view,\n      setView,\n      solveTarget,\n',
              '      view,\n      setView,\n      toolHandoff,\n      requestToolHandoff,\n      clearToolHandoff,\n      solveTarget,\n',
              "state value",
          )
          s = replace_once(
              s,
              '      toast,\n      view,\n      solveTarget,\n',
              '      toast,\n      view,\n      toolHandoff,\n      requestToolHandoff,\n      clearToolHandoff,\n      solveTarget,\n',
              "state deps",
          )
          write(p, s)

          # Expose the same role-passive evidence that produced the visible role pick.
          p = Path("app/src/views/pal-intelligence/species-roles.ts")
          s = read(p)
          s = replace_once(
              s,
              'export interface SpeciesRolePick {\n',
              'export type IntelligenceRole = "combat" | "worker";\n\nexport interface SpeciesRolePick {\n',
              "role type",
          )
          anchor = '''export function buildSpeciesRoleSummary(\n  peers: OwnedPal[],\n  passiveRows: ReadonlyMap<string, PassiveEntry>,\n): SpeciesRoleSummary {\n'''
          helper = '''export function roleTargetPassiveNames(\n  role: IntelligenceRole,\n  pal: OwnedPal,\n  passiveRows: ReadonlyMap<string, PassiveEntry>,\n): string[] {\n  const rows =\n    role === "combat"\n      ? relevantRows(pal, passiveRows, isCombatPassive)\n      : [\n          ...relevantRows(pal, passiveRows, isWorkProductivityPassive),\n          ...relevantRows(pal, passiveRows, isWorkSustainabilityPassive),\n        ];\n  return [...new Set(rows.map((row) => row.name))];\n}\n\n'''
          s = replace_once(s, anchor, helper + anchor, "role passive helper")
          write(p, s)

          # Add a regression proving handoff constraints are exactly role-relevant passives.
          p = Path("app/src/views/pal-intelligence/species-roles.test.ts")
          s = read(p)
          s = replace_once(
              s,
              'import { buildSpeciesRoleSummary } from "./species-roles";\n',
              'import { buildSpeciesRoleSummary, roleTargetPassiveNames } from "./species-roles";\n',
              "role test import",
          )
          insert_at = s.rfind("\n});")
          if insert_at < 0:
              raise SystemExit("anchor missing: role test end")
          test_block = r'''

            test("role handoff passives include only the visible role evidence", () => {
              const mixed = pal({
                instance_id: D,
                passives: ["Musclehead", "Artisan", "Immovable", "Clumsy"],
              });
              expect(roleTargetPassiveNames("combat", mixed, rows)).toEqual(["Musclehead"]);
              expect(roleTargetPassiveNames("worker", mixed, rows)).toEqual([
                "Artisan",
                "Heart of the Immovable King",
              ]);
            });
          '''
          s = s[:insert_at] + test_block + s[insert_at:]
          write(p, s)

          # Role cards get an explicit Improve via Solver action using visible role evidence.
          p = Path("app/src/views/pal-intelligence/species-role-summary.tsx")
          s = read(p)
          s = replace_once(
              s,
              '  buildSpeciesRoleSummary,\n  type SpeciesRolePick,\n',
              '  buildSpeciesRoleSummary,\n  roleTargetPassiveNames,\n  type IntelligenceRole,\n  type SpeciesRolePick,\n',
              "role summary imports",
          )
          s = replace_once(
              s,
              '''function RoleCard({\n  eyebrow,\n  title,\n  pick,\n  onOpen,\n}: {\n  eyebrow: string;\n  title: string;\n  pick: SpeciesRolePick | null;\n  onOpen: (pal: OwnedPal) => void;\n}) {\n''',
              '''function RoleCard({\n  eyebrow,\n  title,\n  role,\n  pick,\n  passiveRows,\n  onOpen,\n  onImprove,\n}: {\n  eyebrow: string;\n  title: string;\n  role: IntelligenceRole;\n  pick: SpeciesRolePick | null;\n  passiveRows: ReadonlyMap<string, PassiveEntry>;\n  onOpen: (pal: OwnedPal) => void;\n  onImprove: (role: IntelligenceRole, pick: SpeciesRolePick, targetPassives: string[]) => void;\n}) {\n''',
              "role card signature",
          )
          s = replace_once(
              s,
              '''        {pick && (\n          <button\n            type="button"\n            onClick={() => onOpen(pick.pal)}\n            className="shrink-0 rounded border border-line bg-panel px-2 py-1 text-[10px] font-medium text-ink-dim transition-colors hover:border-amber/40 hover:text-ink"\n          >\n            Open\n          </button>\n        )}\n''',
              '''        {pick && (\n          <div className="flex shrink-0 items-center gap-1.5">\n            <button\n              type="button"\n              onClick={() =>\n                onImprove(role, pick, roleTargetPassiveNames(role, pick.pal, passiveRows))\n              }\n              className="rounded border border-amber/35 bg-amber/5 px-2 py-1 text-[10px] font-medium text-amber transition-colors hover:bg-amber/10"\n            >\n              Improve via Solver\n            </button>\n            <button\n              type="button"\n              onClick={() => onOpen(pick.pal)}\n              className="rounded border border-line bg-panel px-2 py-1 text-[10px] font-medium text-ink-dim transition-colors hover:border-amber/40 hover:text-ink"\n            >\n              Open\n            </button>\n          </div>\n        )}\n''',
              "role card actions",
          )
          s = replace_once(
              s,
              '''export function SpeciesRoleSummary({\n  peers,\n  passiveRows,\n  onOpenPal,\n}: {\n  peers: OwnedPal[];\n  passiveRows: ReadonlyMap<string, PassiveEntry>;\n  onOpenPal: (pal: OwnedPal) => void;\n}) {\n''',
              '''export function SpeciesRoleSummary({\n  peers,\n  passiveRows,\n  onOpenPal,\n  onImproveRole,\n}: {\n  peers: OwnedPal[];\n  passiveRows: ReadonlyMap<string, PassiveEntry>;\n  onOpenPal: (pal: OwnedPal) => void;\n  onImproveRole: (role: IntelligenceRole, pick: SpeciesRolePick, targetPassives: string[]) => void;\n}) {\n''',
              "role summary props",
          )
          s = replace_once(
              s,
              '''        <RoleCard eyebrow="Role pick" title="Best combat copy" pick={summary.combat} onOpen={onOpenPal} />\n        <RoleCard eyebrow="Role pick" title="Best worker copy" pick={summary.worker} onOpen={onOpenPal} />\n''',
              '''        <RoleCard\n          eyebrow="Role pick"\n          title="Best combat copy"\n          role="combat"\n          pick={summary.combat}\n          passiveRows={passiveRows}\n          onOpen={onOpenPal}\n          onImprove={onImproveRole}\n        />\n        <RoleCard\n          eyebrow="Role pick"\n          title="Best worker copy"\n          role="worker"\n          pick={summary.worker}\n          passiveRows={passiveRows}\n          onOpen={onOpenPal}\n          onImprove={onImproveRole}\n        />\n''',
              "role card calls",
          )
          write(p, s)

          # Pal Intelligence creates handoffs; species-best IVs are suggestions only.
          p = Path("app/src/views/PalIntelligence.tsx")
          s = read(p)
          s = replace_once(
              s,
              'import { hexGuid } from "../components/palbox/selectors";\n',
              'import { hexGuid } from "../components/palbox/selectors";\nimport { buildIvLabHandoff, buildSolverHandoff } from "../lib/tool-handoff";\n',
              "intel handoff imports",
          )
          s = replace_once(
              s,
              '''function InstanceRow({\n  pal,\n  peers,\n  passiveRows,\n  ownerLabel,\n  onOpenDex,\n}: {\n''',
              '''function InstanceRow({\n  pal,\n  peers,\n  passiveRows,\n  ownerLabel,\n  onOpenDex,\n  onOpenIvLab,\n}: {\n''',
              "instance row args",
          )
          s = replace_once(
              s,
              '''  ownerLabel: string;\n  onOpenDex: () => void;\n}) {\n''',
              '''  ownerLabel: string;\n  onOpenDex: () => void;\n  onOpenIvLab: () => void;\n}) {\n''',
              "instance row props",
          )
          s = replace_once(
              s,
              '''        <button\n          type="button"\n          onClick={onOpenDex}\n          className="shrink-0 rounded-md border border-line bg-raised px-2.5 py-1.5 text-[11px] font-medium text-ink-dim transition-colors hover:border-amber/40 hover:text-ink"\n        >\n          Pal-dex\n        </button>\n''',
              '''        <div className="flex shrink-0 flex-col gap-1.5">\n          <button\n            type="button"\n            onClick={onOpenIvLab}\n            className="rounded-md border border-amber/35 bg-amber/5 px-2.5 py-1.5 text-[11px] font-medium text-amber transition-colors hover:bg-amber/10"\n          >\n            IV Lab\n          </button>\n          <button\n            type="button"\n            onClick={onOpenDex}\n            className="rounded-md border border-line bg-raised px-2.5 py-1.5 text-[11px] font-medium text-ink-dim transition-colors hover:border-amber/40 hover:text-ink"\n          >\n            Pal-dex\n          </button>\n        </div>\n''',
              "instance actions",
          )
          s = replace_once(
              s,
              '  const { saveSummary, saveLoading, saveError, playerScope, requestDex } = useAppState();\n',
              '  const { saveSummary, saveLoading, saveError, playerScope, requestDex, requestToolHandoff } = useAppState();\n',
              "intel state",
          )
          anchor = '''  const ownerDistribution = useMemo(() => {\n'''
          helpers = '''  function handoffSubject(group: IntelSpeciesGroup, pal?: OwnedPal) {\n    return {\n      speciesId: group.species_id,\n      speciesName: group.name,\n      ...(pal\n        ? {\n            instanceId: hexGuid(pal.instance_id),\n            instanceLabel: pal.nickname ? `“${pal.nickname}”` : `Level ${pal.level}`,\n          }\n        : {}),\n    };\n  }\n\n  function openSolver(\n    group: IntelSpeciesGroup,\n    requiredPassives: string[] = [],\n    reason = "Selected species from Pal Intelligence.",\n    pal?: OwnedPal,\n  ) {\n    const handoff = buildSolverHandoff(handoffSubject(group, pal), {\n      requiredPassives,\n      reason,\n    });\n    if (handoff) requestToolHandoff(handoff);\n  }\n\n  function openIvLab(group: IntelSpeciesGroup, pal?: OwnedPal) {\n    const handoff = buildIvLabHandoff(handoffSubject(group, pal), {\n      suggestedIvs: {\n        hp: group.iv_ranges.hp[1],\n        attack: group.iv_ranges.attack[1],\n        defense: group.iv_ranges.defense[1],\n      },\n      reason: pal\n        ? "Opened from this owned instance. Species-best owned IV floors are available as an explicit suggestion."\n        : "Opened for this species. Species-best owned IV floors are available as an explicit suggestion.",\n    });\n    if (handoff) requestToolHandoff(handoff);\n  }\n\n'''
          s = replace_once(s, anchor, helpers + anchor, "intel helpers")
          s = replace_once(
              s,
              '''                  <button type="button" onClick={() => requestDex(selected.species_id)} className="rounded-md border border-line bg-raised px-3 py-2 text-[12px] font-medium text-ink-dim transition-colors hover:border-amber/40 hover:text-ink">Open species in Pal-dex</button>\n''',
              '''                  <div className="flex shrink-0 items-center gap-2">\n                    <button\n                      type="button"\n                      onClick={() => openSolver(selected)}\n                      className="rounded-md border border-amber/35 bg-amber/5 px-3 py-2 text-[12px] font-medium text-amber transition-colors hover:bg-amber/10"\n                    >\n                      Solver\n                    </button>\n                    <button\n                      type="button"\n                      onClick={() => openIvLab(selected)}\n                      className="rounded-md border border-amber/35 bg-amber/5 px-3 py-2 text-[12px] font-medium text-amber transition-colors hover:bg-amber/10"\n                    >\n                      IV Lab\n                    </button>\n                    <button type="button" onClick={() => requestDex(selected.species_id)} className="rounded-md border border-line bg-raised px-3 py-2 text-[12px] font-medium text-ink-dim transition-colors hover:border-amber/40 hover:text-ink">Pal-dex</button>\n                  </div>\n''',
              "intel species actions",
          )
          s = replace_once(
              s,
              '''              <SpeciesRoleSummary\n                peers={selected.instances}\n                passiveRows={passiveRows}\n                onOpenPal={(pal) => requestDex(selected.species_id, hexGuid(pal.instance_id))}\n              />\n''',
              '''              <SpeciesRoleSummary\n                peers={selected.instances}\n                passiveRows={passiveRows}\n                onOpenPal={(pal) => requestDex(selected.species_id, hexGuid(pal.instance_id))}\n                onImproveRole={(role, pick, targetPassives) =>\n                  openSolver(\n                    selected,\n                    targetPassives,\n                    targetPassives.length > 0\n                      ? `Improve the visible best ${role} copy using only its role-relevant passives.`\n                      : `Open Solver for the visible best ${role} copy; no role-specific passive target was inferred.`,\n                    pick.pal,\n                  )\n                }\n              />\n''',
              "intel role handoff",
          )
          s = replace_once(
              s,
              '''                    onOpenDex={() => requestDex(selected.species_id, hexGuid(pal.instance_id))}\n                  />\n''',
              '''                    onOpenDex={() => requestDex(selected.species_id, hexGuid(pal.instance_id))}\n                    onOpenIvLab={() => openIvLab(selected, pal)}\n                  />\n''',
              "intel instance ivlab",
          )
          write(p, s)

          # Solver consumes only Solver handoffs, clears stale result/session, and explains what was prefilled.
          p = Path("app/src/views/Solver.tsx")
          s = read(p)
          s = replace_once(
              s,
              'import type { SpeciesDetail } from "../lib/types";\n',
              'import type { SpeciesDetail } from "../lib/types";\nimport type { SolverHandoff } from "../lib/tool-handoff";\n',
              "solver handoff import",
          )
          s = replace_once(
              s,
              '''    solveTarget,\n    clearSolveTarget,\n    requestDex,\n''',
              '''    solveTarget,\n    clearSolveTarget,\n    toolHandoff,\n    clearToolHandoff,\n    requestDex,\n''',
              "solver state destructure",
          )
          s = replace_once(
              s,
              '  const [historyOpen, setHistoryOpen] = useState(false);\n',
              '  const [historyOpen, setHistoryOpen] = useState(false);\n  const [handoffNote, setHandoffNote] = useState<SolverHandoff | null>(null);\n',
              "solver handoff state",
          )
          s = replace_once(
              s,
              '''  // Consume a one-shot queue seed (Pal-dex "Breed missing"): replace the\n''',
              '''  // Pal Intelligence handoff: replace the briefing with only the visible,\n  // defensible constraints the user explicitly chose, and clear stale results.\n  useEffect(() => {\n    if (toolHandoff?.destination !== "solver") return;\n    setSpecies(toolHandoff.subject.speciesName);\n    setPassives(toolHandoff.requiredPassives);\n    setMoves([]);\n    setPins([]);\n    reset();\n    setSolveSession(null);\n    setHandoffNote(toolHandoff);\n    clearToolHandoff();\n  }, [toolHandoff, clearToolHandoff, reset, setSolveSession]);\n\n  // Consume a one-shot queue seed (Pal-dex "Breed missing"): replace the\n''',
              "solver handoff effect",
          )
          s = replace_once(
              s,
              '''    setCatching("breeding_only");\n    closeNaming();\n''',
              '''    setCatching("breeding_only");\n    setHandoffNote(null);\n    closeNaming();\n''',
              "solver reset note",
          )
          s = replace_once(
              s,
              '''      solveTarget === null &&\n      pendingPlanCode === null &&\n''',
              '''      solveTarget === null &&\n      (toolHandoff === null || toolHandoff.destination !== "solver") &&\n      pendingPlanCode === null &&\n''',
              "solver session guard",
          )
          s = replace_once(
              s,
              '''        <label className="flex flex-col gap-1.5">\n          <span className="font-mono text-[11px] uppercase tracking-wider text-ink-faint">\n            Target species\n''',
              '''        {handoffNote && (\n          <div className="rounded-md border border-amber/30 bg-amber/5 px-3 py-2.5">\n            <div className="font-mono text-[9px] uppercase tracking-[0.18em] text-amber">\n              From Pal Intelligence\n            </div>\n            <p className="mt-1 text-[11px] leading-relaxed text-ink-dim">\n              {handoffNote.reason}\n            </p>\n            {handoffNote.subject.instanceLabel && (\n              <div className="mt-1 font-mono text-[10px] text-ink-faint">\n                Context: {handoffNote.subject.instanceLabel}\n              </div>\n            )}\n            <div className="mt-1 font-mono text-[10px] text-ink-faint">\n              {handoffNote.requiredPassives.length > 0\n                ? `Target passives: ${handoffNote.requiredPassives.join(", ")}`\n                : "Species prefilled; no passive target was inferred."}\n            </div>\n          </div>\n        )}\n\n        <label className="flex flex-col gap-1.5">\n          <span className="font-mono text-[11px] uppercase tracking-wider text-ink-faint">\n            Target species\n''',
              "solver notice",
          )
          write(p, s)

          # IV Lab consumes its handoff but leaves IV floors at zero until the user explicitly applies the suggestion.
          p = Path("app/src/views/IvLab.tsx")
          s = read(p)
          s = replace_once(
              s,
              'import { NoPathPanel } from "../components/no-path-panel";\n',
              'import { NoPathPanel } from "../components/no-path-panel";\nimport type { IvLabHandoff } from "../lib/tool-handoff";\n',
              "ivlab handoff import",
          )
          s = replace_once(
              s,
              '''  const { saveDir, saveSummary, requestDex, playerScope, ivLabSession, setIvLabSession } =\n    useAppState();\n''',
              '''  const {\n    saveDir,\n    saveSummary,\n    requestDex,\n    playerScope,\n    ivLabSession,\n    setIvLabSession,\n    toolHandoff,\n    clearToolHandoff,\n  } = useAppState();\n''',
              "ivlab state",
          )
          s = replace_once(
              s,
              '  const [historyOpen, setHistoryOpen] = useState(false);\n',
              '  const [historyOpen, setHistoryOpen] = useState(false);\n  const [handoffNote, setHandoffNote] = useState<IvLabHandoff | null>(null);\n',
              "ivlab handoff state",
          )
          s = replace_once(
              s,
              '''  const idToName = useMemo(\n''',
              '''  // Pal Intelligence handoff: species/context is prefilled immediately,\n  // while suggested IV floors remain opt-in via the visible action below.\n  useEffect(() => {\n    if (toolHandoff?.destination !== "ivlab") return;\n    setSpecies(toolHandoff.subject.speciesName);\n    setIvs({ hp: 0, attack: 0, defense: 0 });\n    setPassives([]);\n    reset();\n    setIvLabSession(null);\n    setHandoffNote(toolHandoff);\n    clearToolHandoff();\n  }, [toolHandoff, clearToolHandoff, reset, setIvLabSession]);\n\n  const idToName = useMemo(\n''',
              "ivlab handoff effect",
          )
          s = replace_once(
              s,
              '''    setMaxSteps(5);\n    closeNaming();\n''',
              '''    setMaxSteps(5);\n    setHandoffNote(null);\n    closeNaming();\n''',
              "ivlab reset note",
          )
          s = replace_once(
              s,
              '''      ivLabSession &&\n      ivLabSession.saveDir === saveDir &&\n''',
              '''      (toolHandoff === null || toolHandoff.destination !== "ivlab") &&\n      ivLabSession &&\n      ivLabSession.saveDir === saveDir &&\n''',
              "ivlab session guard",
          )
          s = replace_once(
              s,
              '''        <label className="flex flex-col gap-1.5">\n          <span className="font-mono text-[11px] uppercase tracking-wider text-ink-faint">\n            Target species\n''',
              '''        {handoffNote && (\n          <div className="rounded-md border border-amber/30 bg-amber/5 px-3 py-2.5">\n            <div className="font-mono text-[9px] uppercase tracking-[0.18em] text-amber">\n              From Pal Intelligence\n            </div>\n            <p className="mt-1 text-[11px] leading-relaxed text-ink-dim">\n              {handoffNote.reason}\n            </p>\n            {handoffNote.subject.instanceLabel && (\n              <div className="mt-1 font-mono text-[10px] text-ink-faint">\n                Owned instance: {handoffNote.subject.instanceLabel}\n              </div>\n            )}\n            {handoffNote.suggestedIvs && (\n              <div className="mt-2 flex items-center justify-between gap-2">\n                <span className="font-mono text-[10px] text-ink-faint">\n                  Suggested species-best floors: HP {handoffNote.suggestedIvs.hp} · ATK {handoffNote.suggestedIvs.attack} · DEF {handoffNote.suggestedIvs.defense}\n                </span>\n                <button\n                  type="button"\n                  onClick={() => setIvs(handoffNote.suggestedIvs!)}\n                  className="shrink-0 rounded border border-amber/35 bg-amber/10 px-2 py-1 text-[10px] font-medium text-amber transition-colors hover:bg-amber/15"\n                >\n                  Use floors\n                </button>\n              </div>\n            )}\n          </div>\n        )}\n\n        <label className="flex flex-col gap-1.5">\n          <span className="font-mono text-[11px] uppercase tracking-wider text-ink-faint">\n            Target species\n''',
              "ivlab notice",
          )
          write(p, s)

          # Start the v0.6 changelog without touching any release manifests.
          p = Path("CHANGELOG.md")
          s = read(p)
          marker = "## [0.5.1] - Unreleased\n"
          if "## [0.6.0] - Unreleased" not in s:
              section = '''## [0.6.0] - Unreleased\n\n### Added\n- Added typed Pal Intelligence handoffs into Solver and IV Lab so selected species and owned-instance context carry across tools without duplicating breeding or IV-planning logic.\n- Best combat/worker role cards can prefill Solver with only the role-relevant passives already justified by visible Pal Intelligence evidence.\n- IV Lab handoffs carry species-best owned IVs as an explicit suggestion; IV floors stay unchanged until the user chooses `Use floors`.\n\n'''
              s = replace_once(s, marker, section + marker, "changelog insertion")
          write(p, s)
          '@ | python -

      - name: Install frontend dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Focused handoff tests
        working-directory: app
        run: bun test src/lib/tool-handoff.test.ts src/views/pal-intelligence/species-roles.test.ts

      - name: Frontend production build
        working-directory: app
        run: bun run build

      - name: Commit verified slice
        shell: pwsh
        run: |
          git diff --check
          git rm .github/workflows/v06-handoff-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md app/src/state.tsx app/src/lib/tool-handoff.ts app/src/lib/tool-handoff.test.ts app/src/views/PalIntelligence.tsx app/src/views/Solver.tsx app/src/views/IvLab.tsx app/src/views/pal-intelligence/species-role-summary.tsx app/src/views/pal-intelligence/species-roles.ts app/src/views/pal-intelligence/species-roles.test.ts
          git commit -m "Connect Pal Intelligence to Solver and IV Lab"
          git push origin HEAD:feature/pal-intelligence-handoffs
